<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Vanguard Custom</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--tx:#eef0f8;--mu:#9aa1c0;--ac:#e0a526;box-sizing:border-box}
@media(prefers-color-scheme:light){:root{--bg:#f3f4f9;--card:#fff;--tx:#161a2e;--mu:#59607f;--ac:#b97d00}}
*{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:env(safe-area-inset-top);z-index:5;background:var(--bg);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid #8884;border-radius:10px;padding:9px}
#q{flex:1 1 100%}
select{flex:1 1 30%;min-width:0}
button.pri{background:var(--ac);color:#111;border:0;font-weight:600}
#info{padding:0 14px 6px;color:var(--mu);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:8px 12px 24px}
.c{background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer}
.c img{display:block;width:100%;aspect-ratio:59/86;object-fit:cover;background:#0003}
.c span{display:block;padding:4px 6px;font-size:11px;line-height:1.2;height:2.7em;overflow:hidden}
#empty{text-align:center;padding:60px 20px;color:var(--mu)}
#empty button{margin-top:14px}
#det{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:none;z-index:10}
#det.on{display:block}
.in{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.in img{width:100%;border-radius:10px;display:block}
h2{margin:14px 0 4px;font-size:20px}
.st{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.st b{background:var(--card);border-radius:8px;padding:5px 9px;font-weight:600;font-size:13px}
.tag{color:var(--mu);font-size:13px;margin:2px 0}
.eff p{background:var(--card);border-radius:10px;padding:10px;margin:8px 0;line-height:1.45}
.eff em{font-style:normal;font-weight:700;color:var(--ac)}
#bar{display:flex;justify-content:space-between;margin-bottom:10px}
#full{position:fixed;inset:0;background:#000;display:none;z-index:20;align-items:center;justify-content:center}
#full.on{display:flex}#full img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Buscar nome ou efeito…">
  <select id="fg"><option value="">Grade</option></select>
  <select id="ft"><option value="">Tipo</option></select>
  <select id="fs"><option value="">Skill</option></select>
  <button class="pri" id="imp">Importar</button>
</header>
<div id="info"></div>
<div id="grid"></div>
<div id="empty" hidden>Nenhuma carta importada ainda.<br>Escolha o .zip da pasta (metadata.json + imagens).<br><button class="pri" id="imp2">Importar zip</button></div>
<div id="det"><div class="in" id="din"></div></div>
<div id="full"><img id="fimg" alt=""></div>
<input id="file" type="file" accept=".zip,.json,image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let cards=[],urls={},imgs=null;
const DB=()=>new Promise((ok,er)=>{const r=indexedDB.open('vg',1);r.onupgradeneeded=()=>{r.result.createObjectStore('k')};r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)});
async function idb(mode,fn){const d=await DB();return new Promise((ok,er)=>{const t=d.transaction('k',mode),s=t.objectStore('k');const r=fn(s);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>er(t.error)})}
const get=k=>idb('readonly',s=>s.get(k)),put=(k,v)=>idb('readwrite',s=>s.put(v,k));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=n=>String(n).split(/[\\/]/).pop().toLowerCase();

async function importFiles(files){
  let meta=null;const im={};
  for(const f of files){
    const n=base(f.name);
    if(n.endsWith('.zip')){
      const z=await JSZip.loadAsync(f);
      for(const e of Object.values(z.files)){
        if(e.dir)continue;const b=base(e.name);
        if(b.endsWith('.json')&&!b.startsWith('.')&&(!meta||b==='metadata.json'))meta=JSON.parse(await e.async('string'));
        else if(/\.(jpe?g|png|webp|gif)$/.test(b)&&!e.name.includes('__MACOSX'))im[b]=await e.async('blob').then(x=>new Blob([x],{type:'image/'+(b.split('.').pop().replace('jpg','jpeg'))}));
      }
    }else if(n.endsWith('.json'))meta=JSON.parse(await f.text());
    else if(f.type.startsWith('image/'))im[n]=f;
  }
  if(!meta||!meta.cards){alert('metadata.json com a lista "cards" não encontrado.');return}
  await put('cards',meta.cards);
  const old=(await get('imgs'))||{};
  await put('imgs',{...old,...im});
  await load();
}
async function load(){
  cards=((await get('cards'))||[]).map((c,k)=>({...c,_k:k}));imgs=(await get('imgs'))||{};
  Object.values(urls).forEach(URL.revokeObjectURL);urls={};
  $('#empty').hidden=cards.length>0;
  fillFilters();render();
}
function fillFilters(){
  const set=(id,vals)=>{const s=$(id),f=s.value,h=s.options[0].outerHTML;s.innerHTML=h+[...new Set(vals)].sort((a,b)=>String(a).localeCompare(b,'pt',{numeric:true})).map(v=>`<option>${esc(v)}</option>`).join('');s.value=f};
  set('#fg',cards.map(c=>c.grade));set('#ft',cards.map(c=>c.type));set('#fs',cards.flatMap(c=>c.skill||[]));
}
const img=c=>{const k=base(c.cImage||'');if(!imgs[k])return'';return urls[k]||(urls[k]=URL.createObjectURL(imgs[k]))};
function render(){
  const q=$('#q').value.toLowerCase(),g=$('#fg').value,t=$('#ft').value,s=$('#fs').value;
  const list=cards.filter(c=>(!q||(c.name+' '+c.effect).toLowerCase().includes(q))&&(!g||String(c.grade)===g)&&(!t||c.type===t)&&(!s||(c.skill||[]).includes(s)));
  $('#info').textContent=cards.length?`${list.length} de ${cards.length} cartas`:'';
  $('#grid').innerHTML=list.map(c=>`<div class="c" data-i="${c._k}"><img loading="lazy" src="${img(c)}" alt=""><span>${esc(c.name)}</span></div>`).join('');
}
function fx(t){return String(t||'').split('\n').map(p=>`<p>${esc(p).replace(/(\[[^\]]+\](?:\([^)]*\))?)/g,'<em>$1</em>')}</p>`).join('')}
function detail(i){
  const c=cards[i];if(!c)return;
  const st=[['Grade',c.grade],['Poder',c.power],['Escudo',c.shield],['Crítico',c.critical],['Drive',c.drive],['Qtd',c.count]].filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!==0&&x[1]!=='');
  $('#din').innerHTML=`<div id="bar"><button id="bk">← Voltar</button><button id="pv">‹</button><button id="nx">›</button></div>
  <img id="di" src="${img(c)}" alt="">
  <h2>${esc(c.name)}</h2>
  <div class="st">${st.map(x=>`<b>${x[0]}: ${x[1]}</b>`).join('')}</div>
  <div class="tag">${esc(c.type)}${c.gift?' · Gift: '+esc(c.gift):''}</div>
  ${(c.skill||[]).length?`<div class="tag">Skill: ${esc(c.skill.join(', '))}</div>`:''}
  ${(c.race||[]).length?`<div class="tag">Raça: ${esc(c.race.join(' / '))}</div>`:''}
  ${(c.nation||[]).length?`<div class="tag">Nação: ${esc(c.nation.join(', '))}</div>`:''}
  <div class="eff">${fx(c.effect)}</div>`;
  $('#det').classList.add('on');$('#det').scrollTop=0;history.pushState({d:1},'');
  const vis=[...document.querySelectorAll('.c')].map(e=>e.dataset.i),p=vis.indexOf(String(c._k));
  const go=d=>{const n=vis[p+d];if(n!==undefined)detail(n)};
  $('#bk').onclick=()=>history.back();$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
  $('#di').onclick=()=>{$('#fimg').src=$('#di').src;$('#full').classList.add('on')};
}
$('#grid').onclick=e=>{const c=e.target.closest('.c');if(c)detail(c.dataset.i)};
$('#full').onclick=()=>$('#full').classList.remove('on');
addEventListener('popstate',()=>{$('#det').classList.remove('on');$('#full').classList.remove('on')});
['#q','#fg','#ft','#fs'].forEach(s=>$(s).addEventListener('input',render));
const pick=()=>$('#file').click();$('#imp').onclick=pick;$('#imp2').onclick=pick;
$('#file').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(!f.length)return;$('#info').textContent='Importando…';try{await importFiles(f)}catch(x){alert('Erro ao importar: '+x.message)}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
load();
</script>
</body>
</html>
